<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PWEB1 — Cap. 05 — AT04 — Inscrição em Evento</title>
    </head>
    <body>
        <header>
            <h1>Semana de Tecnologia IFAL - Formulário de Inscrição</h1>
            <p><a href="../index.html">← Voltar para a página principal</a></p>
        </header>
        <main>
            <form
            action="https://httpbin.org/post"
            method="post"
            enctype="multipart/form-data">
                <fieldset>
                    <legend>Identificação do participante</legend>
                    <label for="nome">Nome Completo:
                        <input 
                        type="text"
                        name="nome"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                        />
                    </label>
                </br>
                    <label for="email">Email Institucional:
                        <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Digite seu email"
                        />
                    </label>
                </br>
                    <label for="cidade">Cidade de origem:
                        <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        list="sugestoes_cidade"
                        placeholder="Digite sua cidade..."
                        />
                    </label>
                    <datalist id="sugestoes_cidade">
                        <option value="Maceió"></option>
                        <option value="Marechal Deodoro"></option>
                        <option value="Penedo"></option>
                        <option value="Arapiraca"></option>
                        <option value="União dos Palmares"></option>
                        <option value="Palmeira dos Índios"></option>
                        <option value="São Miguel dos Campos"></option>
                        <option value="Piranhas"></option>
                    </datalist>
                </br>
                    <label for="foto">Foto para crachá:
                        <input
                        type="file"
                        name="foto"
                        id="foto"
                        accept="image/jpeg, image/png"
                        aria-describedby="legenda"
                        />
                        <small id="legenda">Formatos aceitos: JPG e PNG. Tamanho máximo: 2 MB.</small>
                    </label>
                </fieldset>
                <fieldset>
                    <legend>Preferências para o evento</legend>
                    <label for="chegada">Data e hora preferida para chegada:
                        <input 
                        type="datetime-local"
                        name="chegada"
                        id="chegada"
                        />
                    </label>
                </br>
                    <label for="experiencia">Nível de experiência em programação: <span id="valor-experiencia">5</span>/10
                        <input 
                        type="range"
                        name="experiencia"
                        id="experiencia"
                        min="0"
                        max="10"
                        value="5"
                        step="5"
                        oninput="document.getElementById('valor-experiencia').textContent = this.value"
                        />
                    </label>
                </br>
                    <label for="cor_camiseta">Cor de preferência para a camiseta:
                        <input
                        type="color"
                        name="cor_camiseta"
                        id="cor_camiseta"
                        value="#1a73e8"
                        />
                    </label>
                </br>
                    <label for="oficinas">Oficinas de interesse:
                        <select id="oficinas" name="oficinas[]" multiple size="4" aria-describedby="instrucao">
                            <option value="cyberseguranca">Cybersegurança</option>
                            <option value="dweb">Desenvolvimento Web</option>
                            <option value="github">Github</option>
                            <option value="ia">Inteligência Artificial</option>
                            <option value="etica">Ética no uso de IA</option>
                            <option value="jogos">Desenvolvimento de jogos</option>
                            <option value="hardware">Hardwares</option>
                        </select>
                        <small id="instrucao">Use Ctrl (ou Cmd no Mac) para selecionar mais de uma oficina.</small>
                    </label>
                    <input type="hidden" name="edicao" value="2026" />
                </fieldset>
                <button type="submit">Confirmar Inscrição</button>
            </form>
        </main>
    </body>
</html>
