<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PWEB1 — Cap. 05 — AT01 — Formulário de Contato</title>
    </head>
    <body>
        <header>
            <h1>Formulário para contato</h1>
            <p><a href="../index.html">← Voltar para a página principal</a></p>
        </header>
        <main>
            <form 
            action="https://httpbin.org/get" 
            method="get">
                <label for="nome">Nome Completo:
                    <input 
                    type="text"
                    name="nome"
                    id="nome"
                    placeholder="Digite seu nome"
                    />
                </label>
            </br>
                <label for="email">Email:
                    <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Digite seu email"
                    />
                </label>
            </br>
                <label for="assunto">Assunto:
                    <input
                    type="text"
                    name="assunto"
                    id="assunto"
                    placeholder="Assunto que deseja tratar"
                    />
                </label>
            </br>
                <label for="mensagem">Mensagem:
                    <textarea
                    name="mensagem"
                    id="mensagem"
                    rows="5"
                    maxlength="500"
                    placeholder="Digite sua mensagem"
                    >
                    </textarea>
                </label>
            </br>
                <button type="submit">Enviar</button>
            </form>
        </main>
    </body>
</html>
